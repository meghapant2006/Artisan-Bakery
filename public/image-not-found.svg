<svg width="600" height="450" viewBox="0 0 600 450" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Fresh Bakery Item">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faf8f5" />
      <stop offset="100%" stop-color="#f0e9df" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b4513" />
      <stop offset="50%" stop-color="#daa520" />
      <stop offset="100%" stop-color="#cd853f" />
    </linearGradient>
  </defs>
  <rect width="600" height="450" fill="url(#bgGrad)" />
  <rect x="20" y="20" width="560" height="410" rx="20" fill="none" stroke="#e5ded4" stroke-width="2" stroke-dasharray="8 8" />
  
  <!-- Bakery icon illustration -->
  <g transform="translate(240, 130)" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Croissant / Cake icon -->
    <path d="M10 70 C 10 30, 110 30, 110 70 Z" fill="#daa520" fill-opacity="0.15" />
    <path d="M25 45 C 40 25, 80 25, 95 45" />
    <path d="M40 25 C 50 15, 70 15, 80 25" />
    <circle cx="60" cy="15" r="4" fill="#8b4513" />
    <!-- Plate -->
    <line x1="0" y1="75" x2="120" y2="75" stroke-width="4" stroke="#8b4513" />
  </g>

  <!-- Bakery brand text -->
  <text x="300" y="260" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#8b4513" text-anchor="middle">
    Artisan Bakehouse
  </text>
  <text x="300" y="290" font-family="system-ui, sans-serif" font-size="14" fill="#8c7a6b" text-anchor="middle">
    Freshly Baked Delicacy
  </text>
</svg>
